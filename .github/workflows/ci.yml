name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: webapi compiles
        run: python -m py_compile vendor/irene-va/runva_webapi.py

      - name: deploy script is valid shell
        run: |
          bash -n deploy/deploy.sh
          if command -v shellcheck >/dev/null; then
            shellcheck -S warning deploy/deploy.sh || true
          fi

      # Главная проверка. Интерфейс уже ходит через единый префикс
      # /kolonka/api/, и однажды три теста продолжили считать запросы по
      # старым путям: наборы падали на живом, исправном приложении, и это
      # выглядело как регрессия. Расхождение путей обязано валить сборку.
      - name: routes agree between interface and tests
        run: python tests/check_routes.py

      # Аудио канала устройства: только numpy, без сети и без модели, поэтому
      # идёт в сборку. Раньше детектор конца фразы жил внутри runva_webapi,
      # который при импорте тянет vosk и fastapi и в обычной среде падает на
      # конфликте версий click - то есть проверять его было нечем, кроме
      # контейнера, то есть вручную. Одна неудачная настройка порога тишины
      # снова порубила бы фразы, и заметить это можно было бы только живьём.
      - name: audio logic for the device channel
        run: |
          python -m pip install --quiet numpy
          python vendor/irene-va/jane_audio.py

      # Разбор фраз будильника: тоже чистая логика без сети и без модели.
      # «Поставь будильник на семь утра» - базовая вещь, которой не было.
      - name: alarm phrase parsing
        run: python vendor/irene-va/jane_time.py

      # Ожидание будильникового слова: плата спит, будится по слову и
      # засыпает сама. Проверяется без сокета, иначе нужен был бы живой
      # сервер, а ломалось бы не то.
      - name: wake word waiting
        run: python vendor/irene-va/jane_wake.py

      # Контекст разговора: «а в выходные?» продолжает тему, а не начинает
      # новую. Чистая логика, поэтому проверяется без колонки.
      - name: conversation context
        run: python vendor/irene-va/jane_context.py

      # Умный дом: свет, приборы, падежи и честный отказ, когда устройство
      # не подключено. Без сети и без железа.
      - name: smart home
        run: python vendor/irene-va/jane_home.py

      # Дела при будильнике: «буди в 6:30 и включи свет». Разбор фразы
      # без колонки.
      - name: alarm recipes
        run: python vendor/irene-va/jane_recipe.py

      # Привычки: город, частые команды, темп речи по времени суток.
      - name: habits
        run: python vendor/irene-va/jane_habits.py

      # Управление колонкой: повтори, громче, тише, стоп.
      - name: control
        run: python vendor/irene-va/jane_control.py

      # Напоминания: «напомни купить хлеб». Без времени - спросим,
      # а не придумаем время сами.
      - name: reminders
        run: python vendor/irene-va/jane_remind.py

      # Время и дата голосом. Часы должны отвечать временем, а не тем,
      # как звучит правдоподобный ответ.
      - name: clock
        run: python vendor/irene-va/jane_when.py

      # Детектор речи - чистая логика, ему не нужны ни модель, ни сеть.
      # Настройка порога тишины ломает фразы незаметно: заметить можно было
      # только живым разговором. Полный requirements.txt с torch и gradio
      # тут не нужен, поэтому ставятся только то, что реально требуется.
      - name: speech gate logic
        run: |
          pip install -q "click>=8.1" fastapi uvicorn starlette requests \
                           termcolor numpy python-dateutil
          python tests/test_speech_gate_offline.py

      - name: no secret in tracked files
        run: |
          # Колонка ни с кем не общается, поэтому любой ключ в её исходниках
          # означал бы утечку при зеркалировании репозитория.
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{30,}' -- . \
             | grep -v 'check_routes.py' \
             | grep -v 'deploy/deploy.sh'; then
            echo "::error::найдена строка, похожая на токен бота"
            exit 1
          fi
          echo "ключей в коде нет"
