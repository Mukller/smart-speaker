version: "3.8"

services:
  irene-core:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - irene_options:/app/vendor/irene-va/options
      - irene_models:/models
      # папка с музыкой: файлы кладёшь на хосте, контейнер видит их сразу
      - ${MUSIC_DIR:-../music}:/music:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TTS_MODEL_DIR=/models/tts
      - STT_MODEL_DIR=/models/stt
    restart: unless-stopped

volumes:
  irene_options:
  irene_models:
