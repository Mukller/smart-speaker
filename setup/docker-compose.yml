version: "3.8"

services:
  irene-core:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - irene_options:/app/vendor/irene-va/options
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped

volumes:
  irene_options:
