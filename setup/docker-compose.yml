version: "3.8"

services:
  irene-core:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - irene_options:/app/vendor/irene-va/options
      - irene_models:/models
      # папка с музыкой: файлы кладёшь на хосте, контейнер видит их сразу
      - ${MUSIC_DIR:-../music}:/music:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TTS_MODEL_DIR=/models/tts
      - STT_MODEL_DIR=/models/stt
      # Часовой пояс обязателен. Без него контейнер живёт в UTC, и будильник,
      # поставленный словами «буди в 7 утра», означает 7 утра по UTC - то
      # есть на три часа позже, чем человек просил. Проверка разбора внутри
      # контейнера это показывала сразу: ставим «10:12» по Минску, а получаем
      # 10:12 UTC и «через 10826 с».
      - TZ=${TZ:-Europe/Minsk}
    restart: unless-stopped

volumes:
  irene_options:
  irene_models:
